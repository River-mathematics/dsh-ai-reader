name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check client and host syntax
        run: |
          node --check index.js
          node --check host.js
          node --check client.js
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check worker syntax
        run: python -m py_compile worker/main.py
