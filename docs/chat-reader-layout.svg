<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1a18"/>
      <stop offset="1" stop-color="#121211"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000" flood-opacity="0.28"/>
    </filter>
  </defs>
  <rect width="1200" height="520" fill="url(#bg)"/>
  <text x="48" y="46" fill="#ebe7df" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="21" font-weight="700">同一 Session · 边聊边读</text>
  <text x="48" y="70" fill="#8c877d" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12">聊天保持在左，AI 阅读停靠在右；不用离开对话</text>

  <!-- chat column -->
  <rect x="48" y="96" width="430" height="356" rx="14" fill="#201f1d" stroke="#33312c" filter="url(#shadow)"/>
  <rect x="48" y="96" width="430" height="44" rx="14" fill="#242320"/>
  <rect x="48" y="126" width="430" height="14" fill="#242320"/>
  <circle cx="72" cy="118" r="4" fill="#62d28a"/>
  <text x="86" y="123" fill="#ebe7df" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="13" font-weight="600">对话</text>
  <text x="420" y="123" fill="#777065" font-family="Segoe UI, sans-serif" font-size="11">DeepSeek-V4.1-Flash</text>

  <rect x="170" y="160" width="284" height="52" rx="10" fill="#2b3a66"/>
  <text x="186" y="181" fill="#e8edff" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12">这篇论文的 ODE→SDE 推导怎么理解？</text>
  <text x="186" y="199" fill="#aebbdc" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="10">结合 Eq.(3) 和 Appendix A 解释一下</text>

  <rect x="68" y="228" width="350" height="92" rx="10" fill="#181715" stroke="#2e2c27"/>
  <text x="84" y="249" fill="#8f897d" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="10.5">从确定性 ODE 出发，把漂移项改写成</text>
  <text x="84" y="267" fill="#8f897d" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="10.5">随机微分方程：d x = f dt + σ dw，</text>
  <text x="84" y="285" fill="#8f897d" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="10.5">边缘分布保持不变，因此可以在训练</text>
  <text x="84" y="303" fill="#8f897d" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="10.5">时做随机采样。</text>

  <rect x="68" y="334" width="300" height="42" rx="10" fill="#232a44" stroke="#3f4b73"/>
  <text x="82" y="359" fill="#b9c8ff" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="11">已引用：Eq.(3) / Appendix A</text>

  <rect x="68" y="398" width="390" height="34" rx="9" fill="#171615" stroke="#33312c"/>
  <text x="84" y="420" fill="#6f695f" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="11">继续问这篇论文…</text>

  <!-- reader column -->
  <rect x="560" y="96" width="592" height="356" rx="14" fill="#f7f5ef" stroke="#d8d2c6" filter="url(#shadow)"/>
  <rect x="560" y="96" width="592" height="42" rx="14" fill="#f0ede5"/>
  <rect x="560" y="124" width="592" height="14" fill="#f0ede5"/>
  <rect x="580" y="106" width="20" height="20" rx="6" fill="#3f6df6"/>
  <path d="M586 111h8v11h-8z" fill="none" stroke="#fff" stroke-width="1.5"/>
  <text x="610" y="121" fill="#24211c" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="700">AI 阅读</text>
  <text x="668" y="121" fill="#8a8377" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="10">Flow-GRPO · 第 1 页</text>
  <rect x="1010" y="106" width="62" height="20" rx="5" fill="#e8e4da"/>
  <text x="1020" y="120" fill="#777065" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="9">对照</text>
  <rect x="1078" y="106" width="56" height="20" rx="5" fill="#fff"/>
  <text x="1088" y="120" fill="#777065" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="9">沉浸</text>

  <!-- mini page -->
  <rect x="580" y="156" width="218" height="276" rx="4" fill="#fff" stroke="#e1dbcf"/>
  <text x="607" y="182" fill="#24211c" font-family="Georgia, serif" font-size="10" font-weight="700">Flow-GRPO: Training</text>
  <text x="607" y="196" fill="#24211c" font-family="Georgia, serif" font-size="10" font-weight="700">Flow Matching Models</text>
  <line x1="607" y1="205" x2="770" y2="205" stroke="#24211c" stroke-width="2"/>
  <text x="614" y="222" fill="#6c665b" font-family="Georgia, serif" font-size="6.5">Abstract</text>
  <g fill="#a8a196">
    <rect x="607" y="230" width="164" height="4" rx="2"/>
    <rect x="607" y="239" width="164" height="4" rx="2"/>
    <rect x="607" y="248" width="164" height="4" rx="2"/>
    <rect x="607" y="257" width="150" height="4" rx="2"/>
    <rect x="607" y="270" width="164" height="4" rx="2"/>
    <rect x="607" y="279" width="164" height="4" rx="2"/>
    <rect x="607" y="288" width="120" height="4" rx="2"/>
  </g>
  <rect x="607" y="306" width="164" height="54" rx="4" fill="#fbf8ee" stroke="#d6caa9"/>
  <g fill="#8c8270">
    <rect x="615" y="315" width="146" height="4" rx="2"/>
    <rect x="615" y="324" width="146" height="4" rx="2"/>
    <rect x="615" y="333" width="128" height="4" rx="2"/>
    <rect x="615" y="342" width="140" height="4" rx="2"/>
  </g>

  <!-- translation column -->
  <text x="824" y="172" fill="#8a8377" font-family="Segoe UI, sans-serif" font-size="8.5">FLOW-GRPO: TRAINING FLOW MATCHING MODELS VIA ONLINE RL</text>
  <text x="824" y="196" fill="#24211c" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="16" font-weight="700">Flow-GRPO：通过在线强化学习</text>
  <text x="824" y="218" fill="#24211c" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="16" font-weight="700">训练流匹配模型</text>
  <text x="824" y="242" fill="#8a8377" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="9">摘要</text>
  <text x="824" y="260" fill="#6f695f" font-family="Georgia, serif" font-size="8.5">We propose Flow-GRPO, the first method to integrate</text>
  <text x="824" y="272" fill="#6f695f" font-family="Georgia, serif" font-size="8.5">online policy gradient reinforcement learning …</text>
  <text x="824" y="293" fill="#24211c" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="10.5">我们提出了 Flow-GRPO，这是首个将在线</text>
  <text x="824" y="308" fill="#24211c" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="10.5">策略梯度强化学习（RL）集成到流匹配</text>
  <text x="824" y="323" fill="#24211c" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="10.5">模型中的方法。我们的方法采用两个关键</text>
  <text x="824" y="338" fill="#24211c" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="10.5">策略。</text>

  <!-- chips -->
  <rect x="824" y="360" width="86" height="24" rx="6" fill="#f0ede5"/>
  <text x="836" y="376" fill="#777065" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="9">术语表</text>
  <rect x="918" y="360" width="86" height="24" rx="6" fill="#f0ede5"/>
  <text x="930" y="376" fill="#777065" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="9">文内搜索</text>
  <rect x="1012" y="360" width="86" height="24" rx="6" fill="#f0ede5"/>
  <text x="1024" y="376" fill="#777065" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="9">导出</text>

  <!-- divider / arrow -->
  <line x1="500" y1="130" x2="500" y2="430" stroke="#3a3731" stroke-dasharray="4 5"/>
  <circle cx="500" cy="274" r="18" fill="#3f6df6"/>
  <path d="M493 274h14m-5-5 5 5-5 5" stroke="#fff" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="447" y="306" fill="#7d9bff" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="10">右侧栏</text>

  <text x="48" y="492" fill="#6f695f" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="11">布局示意：左侧对话，右侧 AI 阅读；右侧栏是 Session 级的，聊天和译文共享同一个上下文。</text>
</svg>
